---
layout: default
---
<div class="post">

  <header class="post-header">
    {% if page.title == "Resume" %}
      <h1 class="post-title">
        <a href="{{ page.url | prepend: site.baseurl }}" class="post-title-link">{{ page.title }}</a>
      </h1>
    {% else %}
      <h1 class="post-title">{{ page.title }}</h1>
    {% endif %}
    <p class="post-description">{{ page.description }}</p>
  </header>

  <article>
    {{ content }}
  </article>

</div>
